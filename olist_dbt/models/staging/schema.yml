version: 2

models:
  - name: stg_orders
    description: >
      Staging model for orders. One row per order.
      Cleans and renames columns from the raw Olist orders dataset.
      Source: olist_orders_dataset.csv
    columns:
      - name: order_id
        description: "Unique identifier for each order. Primary key."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers. Identifies the customer who placed the order."
        tests:
          - not_null
      - name: order_status
        description: "Current lifecycle status of the order."
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'invoiced', 'processing', 'created', 'approved', 'unavailable']
      - name: ordered_at
        description: "Timestamp when the order was placed by the customer."
      - name: delivered_at
        description: "Timestamp when the order was delivered to the customer. Null if not yet delivered."
      - name: estimated_delivery_at
        description: "Estimated delivery date provided at time of purchase."

  - name: stg_customers
    description: >
      Staging model for customers. One row per customer.
      Cleans and renames columns from the raw Olist customers dataset.
    columns:
      - name: customer_id
        description: "Unique identifier for each customer. Primary key."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier that persists across multiple orders from the same customer."
      - name: customer_zip_code
        description: "Customer zip code prefix (first 5 digits)."
      - name: customer_city
        description: "City where the customer is located."
      - name: customer_state
        description: "Brazilian state code where the customer is located."
        tests:
          - not_null

  - name: stg_order_items
    description: >
      Staging model for order items. One row per item within an order.
      A single order can contain multiple items from different sellers.
    columns:
      - name: order_id
        description: "Foreign key to stg_orders."
        tests:
          - not_null
      - name: order_item_id
        description: "Sequential item number within an order. Combined with order_id forms the natural key."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to the product being purchased."
      - name: seller_id
        description: "Foreign key to the seller fulfilling this item."
      - name: shipping_limit_at
        description: "Deadline for the seller to hand the item to the logistics partner."
      - name: price
        description: "Item price in Brazilian Reais."
        tests:
          - not_null
          - positive_values
      - name: freight_value
        description: "Freight cost for this item in Brazilian Reais."

  - name: stg_payments
    description: >
      Staging model for payments. One row per payment.
      An order can have multiple payments (e.g. credit card + voucher).
    columns:
      - name: order_id
        description: "Foreign key to stg_orders."
        tests:
          - not_null
      - name: payment_sequential
        description: "Sequence number of the payment within the order. Starts at 1."
      - name: payment_type
        description: "Payment method used (credit_card, boleto, voucher, debit_card)."
      - name: payment_installments
        description: "Number of installments chosen by the customer."
      - name: payment_value
        description: "Total value of this payment in Brazilian Reais."
        tests:
          - not_null
          - positive_values